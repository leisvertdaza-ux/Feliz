<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#6a1b9a">
  <title>Recuerdos para Kely 💜</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Nunito:wght@400;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="paginas.css">
</head>
<body>
  <video id="bgVideo" autoplay muted loop playsinline preload="auto" aria-hidden="true"><source src="fondo.mp4" type="video/mp4"></video>
  <div class="page-veil" aria-hidden="true"></div>
  <div class="lilac-fall-layer" aria-hidden="true"></div>
  <a class="back-link" href="index.html#inicio">← Volver</a>
  <button class="music-control" id="musicControl" type="button" aria-label="Activar música">🔇</button>

  <main class="page-wrap">
    <article class="page-card">
      <span class="corner-flower one" aria-hidden="true"></span><span class="corner-flower two" aria-hidden="true"></span>
      <img class="snoopy-peek" src="snoopy2.png" alt="Snoopy asomándose">
      <p class="eyebrow">Postales para sonreír</p>
      <h1>Instantes que guardo ✨</h1>
      <p>Voltea las fotografías: al reverso hay unas palabras para ti.</p>
      <div class="hanging-line" aria-hidden="true"></div>
      <div class="memory-gallery">
        <figure class="memory-photo">
          <span class="clothespin" aria-hidden="true"></span>
          <button class="photo-flipper" type="button" aria-label="Voltear foto: Un día para recordar" aria-pressed="false">
            <span class="photo-inner">
              <span class="photo-face photo-front"><img src="imagen.png" alt="Fotografía de un día para recordar"><span class="photo-face-caption">Un día para recordar</span></span>
              <span class="photo-face photo-back"><span>¿Tú? Eres como ese amanecer bonito. ¿Y yo? Soy esa persona que nunca se cansará de mirarte. 💜</span></span>
            </span>
          </button>
        </figure>
        <figure class="memory-photo">
          <span class="clothespin" aria-hidden="true"></span>
          <button class="photo-flipper" type="button" aria-label="Voltear foto: Una sonrisa compartida" aria-pressed="false">
            <span class="photo-inner">
              <span class="photo-face photo-front"><img src="imagen01.png" alt="Fotografía de una sonrisa compartida"><span class="photo-face-caption">Una sonrisa compartida</span></span>
              <span class="photo-face photo-back"><span>Puedes estar lejos de mis ojos, pero no de mis pensamientos. 💗</span></span>
            </span>
          </button>
        </figure>
        <figure class="memory-photo">
          <span class="clothespin" aria-hidden="true"></span>
          <button class="photo-flipper" type="button" aria-label="Voltear foto: Más aventuras contigo" aria-pressed="false">
            <span class="photo-inner">
              <span class="photo-face photo-front"><img src="imag.png" alt="Fotografía de nuevas aventuras"><span class="photo-face-caption">Más aventuras contigo</span></span>
              <span class="photo-face photo-back"><span>Si el río corre hacia el mar, el sol vuelve a amanecer y mi mirada se queda en ti, porque eres lo más bello de ver. 🌸</span></span>
            </span>
          </button>
        </figure>
      </div>
    </article>
  </main>
  <nav class="page-nav" aria-label="Más detalles">
    <a href="deseo.html">Un deseo</a><a href="recuerdos.html" aria-current="page">Un recuerdo</a><a href="mensaje.html">Un mensaje</a>
  </nav>
  <script src="paginas.js"></script>
</body>
</html>
